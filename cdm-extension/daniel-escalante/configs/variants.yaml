# Phase-A variants, limits and stage jobs (SPEC 3.3-3.5, 9). Every approval binds this file's digest.
limits: {max_steps: 13, max_length: 4096, context: 4352, completion: 256}
variants:
  V0: {}
  V0-rerun: {}
  V0-shadow: {shadow: true}
  V2: {g2: true, g3: true}
  V3: {g1: true, g2: true, g3: true}
stages:
  smoke: {split: val, jobs: [V3]}
  bench-a: {split: val, jobs: [V0-shadow, V3]}
  val-a: {split: val, jobs: [V0, V0-shadow, V2, V3]}
  test-a: {split: test, jobs: [V0-rerun, V2, V3]}
# Phase B (SPEC 4.4-4.5): planner constants, arms on top of V3 and their stage jobs.
planner: {theta_stop: 0.05, beta: 1}
arms:
  B-uniform: {g1: true, g2: true, g3: true, planner: {kind: uniform}}
  B-marginal: {g1: true, g2: true, g3: true, planner: {kind: marginal}}
  B-learned-s0: {g1: true, g2: true, g3: true, planner: {kind: learned, seed: 0}}
  B-learned-s1: {g1: true, g2: true, g3: true, planner: {kind: learned, seed: 1}}
  B-learned-s2: {g1: true, g2: true, g3: true, planner: {kind: learned, seed: 2}}
  B-oracle: {g1: true, g2: true, g3: true, planner: {kind: oracle}}
  B-a0.1-T1-n0: {g1: true, g2: true, g3: true, planner: {kind: corrupt, alpha: 0.1, temperature: 1, noise_seed: 0}}
  B-a0.1-T1-n1: {g1: true, g2: true, g3: true, planner: {kind: corrupt, alpha: 0.1, temperature: 1, noise_seed: 1}}
  B-a0.1-T0.25-n0: {g1: true, g2: true, g3: true, planner: {kind: corrupt, alpha: 0.1, temperature: 0.25, noise_seed: 0}}
  B-a0.1-T0.25-n1: {g1: true, g2: true, g3: true, planner: {kind: corrupt, alpha: 0.1, temperature: 0.25, noise_seed: 1}}
  B-a0.3-T1-n0: {g1: true, g2: true, g3: true, planner: {kind: corrupt, alpha: 0.3, temperature: 1, noise_seed: 0}}
  B-a0.3-T1-n1: {g1: true, g2: true, g3: true, planner: {kind: corrupt, alpha: 0.3, temperature: 1, noise_seed: 1}}
  B-a0.3-T0.25-n0: {g1: true, g2: true, g3: true, planner: {kind: corrupt, alpha: 0.3, temperature: 0.25, noise_seed: 0}}
  B-a0.3-T0.25-n1: {g1: true, g2: true, g3: true, planner: {kind: corrupt, alpha: 0.3, temperature: 0.25, noise_seed: 1}}
stages_b:
  bench-b: {split: val, jobs: [B-learned-s0, B-oracle]}
  val-b: {split: val, jobs: [B-uniform, B-learned-s0, B-oracle]}
  test-b: {split: test, jobs: [B-uniform, B-marginal, B-learned-s0, B-learned-s1, B-learned-s2, B-oracle, B-a0.1-T1-n0, B-a0.1-T1-n1, B-a0.1-T0.25-n0, B-a0.1-T0.25-n1, B-a0.3-T1-n0, B-a0.3-T1-n1, B-a0.3-T0.25-n0, B-a0.3-T0.25-n1]}
