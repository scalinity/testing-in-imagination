[project]
name = "tiicee"
version = "0.1.0"
description = "Study TII-CEE-1: conservation of expected evidence for agents that plan with imagined test results"
requires-python = ">=3.11,<3.13"
# numpy is pinned to the version in the cluster's GPU runtime and the tim CPU lock.
# The package is never installed on the cluster; jobs put tii-cee/ on sys.path.
dependencies = ["numpy==1.26.4"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
