[project]
name = "cdm-replication-checks"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scipy==1.15.2",
  "scikit-learn==1.6.1",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "pyyaml==6.0.2",
  "antlr4-python3-runtime==4.9.3",
  "pytest==8.4.2",
  "torch==2.6.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
