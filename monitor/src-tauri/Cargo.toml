[package]
name = "tii-monitor"
version = "0.1.0"
description = "Live monitor for study TII-CEE-1"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[profile.release]
opt-level = 2
strip = true
